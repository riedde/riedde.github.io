#Add "layout: compress" here to compress the html code
---

<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en">
  <!--<![endif]-->
  {% include head.html %}
  <style>
    body {
      padding: 0 !important;
    }
    .wrapper {
      max-width: unset !important;
    }
    /* Compact two-column skill bars for print/PDF */
    .skills-section .skillset {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 30px;
    }
    .skills-section .skillset .item {
      margin-bottom: 10px;
    }
    .skills-section .skillset .level-title,
    .skills-section .skillset .level-bar {
      float: none;
      width: 100%;
    }
    .skills-section .skillset .level-title {
      margin-bottom: 4px;
    }
  </style>
  <body>
    <div class="wrapper">
      {% include sidebar.html %}

      <div class="main-wrapper">{{ content }}</div>
    </div>
    {% include scripts.html %}
  </body>
</html>
